name: Deploy Smooches

# CI on every PR to main; provision + deploy only on push to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write # OIDC login to Azure (no stored client secret)
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22'
  API_PROJECT: SmoochesApp/SmoochesApp.csproj
  WEB_DIR: Smooches.UI

jobs:
  # ---------------------------- CI (PRs) ----------------------------
  ci:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Test .NET solution
        run: dotnet test SmoochesApp.slnx --nologo
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install + type-check + build SPA
        working-directory: ${{ env.WEB_DIR }}
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

  # --------------------- Provision infra (main) ---------------------
  provision:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      apiUrl: ${{ steps.bicep.outputs.apiUrl }}
      apiName: ${{ steps.bicep.outputs.apiName }}
      swaName: ${{ steps.bicep.outputs.swaName }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - id: bicep
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            outputs=$(az deployment group create \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --template-file infra/main.bicep \
              --parameters namePrefix=smooches \
                           sqlAdminLogin='${{ secrets.SQL_ADMIN_LOGIN }}' \
                           sqlAdminPassword='${{ secrets.SQL_ADMIN_PASSWORD }}' \
              --query properties.outputs -o json)
            echo "apiUrl=$(echo "$outputs" | jq -r .apiUrl.value)" >> "$GITHUB_OUTPUT"
            echo "apiName=$(echo "$outputs" | jq -r .apiName.value)" >> "$GITHUB_OUTPUT"
            echo "swaName=$(echo "$outputs" | jq -r .staticWebAppName.value)" >> "$GITHUB_OUTPUT"

  # ----------------------- Build + deploy API -----------------------
  deploy-api:
    if: github.event_name == 'push'
    needs: provision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Publish API
        run: dotnet publish ${{ env.API_PROJECT }} -c Release -o publish
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ needs.provision.outputs.apiName }}
          package: publish

  # ----------------------- Build + deploy SPA -----------------------
  deploy-web:
    if: github.event_name == 'push'
    needs: provision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build SPA against the prod API
        working-directory: ${{ env.WEB_DIR }}
        run: |
          npm ci
          npm run build
        env:
          VITE_API_BASE_URL: ${{ needs.provision.outputs.apiUrl }}/api
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - id: swatoken
        name: Fetch the Static Web App deploy token
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            token=$(az staticwebapp secrets list -n ${{ needs.provision.outputs.swaName }} --query properties.apiKey -o tsv)
            echo "::add-mask::$token"
            echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Upload prebuilt SPA to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swatoken.outputs.token }}
          action: upload
          app_location: ${{ env.WEB_DIR }}/dist
          output_location: ''
          skip_app_build: true
          skip_api_build: true
